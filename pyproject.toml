[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "personal-data-hub"
version = "0.1.1"
description = "Local YAML-driven SQLite data hub with safe imports, audit, REST, Web and MCP"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "The personal-data-hub Authors"}]
dependencies = ["PyYAML>=6,<7", "openpyxl>=3.1,<4", "pdfplumber>=0.11,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "mcp>=1.16,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.11,<1", "httpx>=0.27,<1", "reportlab>=4,<5"]

[project.scripts]
hub = "personal_data_hub.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
